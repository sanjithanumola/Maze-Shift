<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14264d" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" />

  <!-- Maze Labyrinth Glyph -->
  <g filter="url(#glow)">
    <!-- Outer wall boundary -->
    <path d="M 96 96 L 416 96 L 416 416 L 96 416 Z" fill="none" stroke="url(#neonCyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner maze tracks -->
    <path d="M 160 96 L 160 256 L 256 256" fill="none" stroke="url(#neonCyan)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 352 96 L 352 200 L 224 200 L 224 160" fill="none" stroke="url(#neonCyan)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 96 320 L 224 320 L 224 360" fill="none" stroke="url(#neonCyan)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 416 280 L 300 280 L 300 360 L 360 360" fill="none" stroke="url(#neonCyan)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Player Core Start Point -->
    <circle cx="160" cy="160" r="16" fill="#00f0ff" />
    <!-- Exit Vortex End Point -->
    <circle cx="352" cy="352" r="20" fill="#10b981" />
  </g>
</svg>
